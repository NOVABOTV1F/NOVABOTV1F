<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA DEV V1F</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b1a;color:#eee;font-family:'Segoe UI',sans-serif;padding:1rem}
.container{max-width:900px;margin:auto}
.card{background:#14142a;padding:1.5rem;border-radius:20px;margin-bottom:1rem;border:1px solid #2a2a4a}
.video-box video{width:100%;max-height:300px;border-radius:16px;background:#000}
.upload-area{border:2px dashed #a78bfa;padding:2rem;text-align:center;cursor:pointer;border-radius:16px}
.upload-area:hover{background:#1a1a2e}
.file-tag{background:#2a2a4a;padding:4px 12px;border-radius:12px;margin:4px;display:inline-block}
.btn{width:100%;padding:.8rem;border:none;border-radius:12px;background:#a78bfa;color:#000;font-weight:700;cursor:pointer}
.btn:hover{background:#8b5cf6}
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:999}
.loading-overlay.active{display:flex}
.loading-overlay video{max-width:90%;max-height:70vh}
.loading-overlay .label{color:#fff;margin-top:1rem}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <video id="loadingVideo" autoplay muted loop playsinline>
    <source src="https://raw.githubusercontent.com/NOVABOTV1F/NOVABOTV1F/main/tiktokio.com1787646875_pod3E5BGmXaOQp4K0xmn.mp4" type="video/mp4">
  </video>
  <div class="label" id="loadingLabel">⏳ Sedang memproses...</div>
</div>

<div class="container">
  <div class="card" style="text-align:center">
    <h1 style="font-size:2.2rem;color:#a78bfa">NOVA DEV V1F</h1>
    <p style="color:#888">Upload → Deploy → Clone</p>
  </div>

  <!-- Video Intro -->
  <div class="card">
    <h2>🎬 Intro</h2>
    <div class="video-box">
      <video id="introVideo" controls playsinline>
        <source src="https://raw.githubusercontent.com/NOVABOTV1F/NOVABOTV1F/main/tiktokio.com1787647908_j625ly1ubvKUxw51K6yT.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <!-- Upload & Deploy -->
  <div class="card">
    <h2>📦 Upload & Deploy</h2>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      📂 Klik pilih file (dari ZArchiver)
      <input type="file" id="fileInput" multiple onchange="handleFiles(this.files)" style="display:none">
    </div>
    <div id="fileList"></div>
    <select id="platformSelect" style="width:100%;padding:.7rem;border-radius:10px;background:#1a1a2e;color:#eee;margin:.5rem 0;border:1px solid #2a2a4a">
      <option value="github">GitHub Pages</option>
      <option value="netlify">Netlify</option>
    </select>
    <button class="btn" onclick="startDeploy()">🚀 Deploy</button>
    <div id="resultBox" style="margin-top:1rem;display:none;background:#1a1a2e;padding:1rem;border-radius:12px">
      ✅ Live: <a href="#" id="resultLink" target="_blank">link</a>
    </div>
  </div>

  <!-- Clone -->
  <div class="card">
    <h2>🔄 Clone Website</h2>
    <input type="text" id="cloneUrl" placeholder="https://example.com" style="width:100%;padding:.7rem;border-radius:10px;background:#1a1a2e;color:#eee;border:1px solid #2a2a4a">
    <button class="btn" onclick="startClone()" style="background:#3b82f6">📋 Clone</button>
    <div id="cloneGrid" style="margin-top:1rem"></div>
  </div>
</div>

<script>
// ===== TOKEN (DIISI SENDIRI) =====
const TOKENS = { 
  github: "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",
  netlify: "nfp_YK8x82uUZo2x1o9G79dGjc3hrojSTmU92f43"
};

// ===== LOADING =====
function showLoading(text){
  document.getElementById('loadingOverlay').classList.add('active');
  document.getElementById('loadingLabel').textContent = text || '⏳ Loading...';
}
function hideLoading(){ document.getElementById('loadingOverlay').classList.remove('active'); }

// ===== FILE =====
let selectedFiles = [];
function handleFiles(files){
  selectedFiles = Array.from(files);
  document.getElementById('fileList').innerHTML = selectedFiles.map(f => `<span class="file-tag">📄 ${f.name} (${(f.size/1024).toFixed(0)}KB)</span>`).join('');
}

// ===== READ FILE AS BASE64 =====
function readFileAsBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ===== DEPLOY KE GITHUB PAGES (BENERAN) =====
async function deployToGithub(files, token, repo){
  for(let f of files){
    const content = await readFileAsBase64(f);
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${f.name}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${token}` },
      body: JSON.stringify({ message: 'Upload via NOVA', content })
    });
    if(!res.ok) throw new Error('Gagal upload ' + f.name);
  }
  return `https://${repo.split('/')[0]}.github.io/${repo.split('/')[1]}/`;
}

// ===== DEPLOY KE NETLIFY (BENERAN) =====
async function deployToNetlify(files, token){
  const site = await fetch('https://api.netlify.com/api/v1/sites', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({ name: 'nova-deploy-' + Date.now() })
  }).then(r => r.json());
  
  for(let f of files){
    const content = await readFileAsBase64(f);
    await fetch(`https://api.netlify.com/api/v1/sites/${site.id}/files/${f.name}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ content })
    });
  }
  return site.ssl_url || site.url;
}

// ===== START DEPLOY =====
async function startDeploy(){
  if(selectedFiles.length === 0){ alert('Pilih file dulu!'); return; }
  const platform = document.getElementById('platformSelect').value;
  const token = TOKENS[platform];
  if(!token){ alert('Token '+platform+' belum diisi'); return; }

  showLoading('🚀 Deploy ke ' + platform + '...');
  try{
    let link;
    if(platform === 'github'){
      const repo = 'NOVABOTV1F/NOVABOTV1F';
      link = await deployToGithub(selectedFiles, token, repo);
    } else {
      link = await deployToNetlify(selectedFiles, token);
    }
    document.getElementById('resultLink').href = link;
    document.getElementById('resultLink').textContent = link;
    document.getElementById('resultBox').style.display = 'block';
  } catch(e){
    alert('Error: ' + e.message);
  }
  hideLoading();
}

// ===== CLONE WEBSITE (COPY HTML) =====
async function startClone(){
  const url = document.getElementById('cloneUrl').value.trim();
  if(!url){ alert('Masukkan URL website'); return; }
  showLoading('🔄 Clone...');
  try{
    const res = await fetch('https://corsproxy.io/?url=' + encodeURIComponent(url));
    const html = await res.text();
    document.getElementById('cloneGrid').innerHTML = `
      <h3 style="color:#a78bfa">Hasil Clone</h3>
      <pre style="background:#0b0b1a;padding:1rem;border-radius:12px;max-height:300px;overflow:auto;font-size:.8rem">${html.replace(/</g,'&lt;')}</pre>
      <button onclick="downloadHTML('${encodeURIComponent(html)}')" class="btn" style="margin-top:.5rem">⬇️ Download HTML</button>
    `;
  } catch(e){
    alert('Gagal clone: ' + e.message);
  }
  hideLoading();
}

function downloadHTML(encoded){
  const a = document.createElement('a');
  a.href = 'data:text/html;charset=utf-8,' + decodeURIComponent(encoded);
  a.download = 'clone.html';
  a.click();
}
</script>
</body>
</html>
